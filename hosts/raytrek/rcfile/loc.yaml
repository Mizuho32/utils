:before_install:
- "./before_install.rb"
- "./fish/fish_logo_install.bash"
  #- "./flatpak/before_install.rb"
:after_install:
- "systemctl --user daemon-reload"
- "kbuildsycoca6"
# herdr has no plugin dir auto-discovery; registry is ~/.config/herdr/plugins.json (link is idempotent)
